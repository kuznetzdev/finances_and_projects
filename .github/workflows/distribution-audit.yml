name: Deep financial generation distribution audit

on:
  workflow_dispatch:
  schedule:
    - cron: '17 4 * * 1'

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Audit 1000 seeds per template and difficulty tier
        run: npm run audit:distributions:deep
      - name: Upload detailed distribution report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: deep-financial-distributions
          path: |
            artifacts/generator-distributions.json
            artifacts/generator-distributions.md
          if-no-files-found: warn
