name: Test and deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Node.js for testing
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Run all tests
        run: npm test
      - name: Validate content and financial identities before deployment
        run: npm run preflight
      - name: Generate full financial verification matrix
        run: npm run coverage:finance
      - name: Distribution and plausibility smoke audit
        run: npm run audit:distributions
      - name: Deep distribution audit (1000 seeds per tier)
        run: npm run audit:distributions:deep
      - name: Install browser test harness
        run: npm install --no-save playwright-core@1.56.0
      - name: Desktop/mobile browser checks
        run: |
          node scripts/smoke-paradoxes.mjs
          node scripts/smoke-visual.mjs
          node scripts/smoke-lecture-cases.mjs
      - name: Attach preflight report and visual evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: predeploy-validation-evidence
          path: |
            artifacts/preflight-report.json
            artifacts/finance-coverage.md
            artifacts/finance-coverage.json
            artifacts/generator-distributions.json
            artifacts/generator-distributions.md
            artifacts/*.png
          if-no-files-found: ignore

  deploy:
    needs: test
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Upload static site
        uses: actions/upload-pages-artifact@v4
        with:
          path: ./site
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
