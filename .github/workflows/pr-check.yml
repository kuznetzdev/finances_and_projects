name: Finance application pre-deploy checks

on:
  pull_request:
    paths:
      - 'site/**'
      - 'tests/**'
      - 'scripts/**'
      - 'package.json'
      - '.github/workflows/**'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Unit, integration and syntax tests
        run: npm test
      - name: Financial and content preflight (blocks bad data)
        run: npm run preflight
      - name: Install browser harness
        run: npm install --no-save playwright-core@1.56.0
      - name: Browser smoke test (desktop and mobile)
        run: node scripts/smoke-paradoxes.mjs
      - name: Typography, math and icon browser smoke test
        run: node scripts/smoke-visual.mjs
      - name: Lecture cases Chromium smoke test
        run: node scripts/smoke-lecture-cases.mjs
      - name: Attach UI screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: application-preflight-evidence
          path: |
            artifacts/preflight-report.json
            artifacts/paradoxes-*.png
            artifacts/visual-*.png
            artifacts/lecture-*.png
          if-no-files-found: ignore
