name: Check paradoxes pull request

on:
  pull_request:
    paths:
      - 'site/**'
      - 'tests/**'
      - 'scripts/smoke-paradoxes.mjs'
      - 'scripts/smoke-visual.mjs'
      - 'package.json'
      - '.github/workflows/pr-check.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Unit, integration and syntax tests
        run: npm test
      - name: Install browser harness
        run: npm install --no-save playwright-core@1.56.0
      - name: Browser smoke test (desktop and mobile)
        run: node scripts/smoke-paradoxes.mjs
      - name: Typography, math and icon browser smoke test
        run: node scripts/smoke-visual.mjs
      - name: Attach UI screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: paradoxes-screenshots
          path: |
            artifacts/paradoxes-*.png
            artifacts/visual-*.png
          if-no-files-found: ignore
